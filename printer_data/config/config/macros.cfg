#####################################################################
#   Blobifier Safety
#####################################################################

[gcode_macro BLOBIFIER_SAFETY_LIFT]
gcode:
    # --- FORCE Z-HOP SAFETY FOR BLOBIFIER ---
    {% if printer.toolhead.position.z < 10.0 %}
        RESPOND TYPE=echo MSG="Lifting Z to 10mm safety height before travel"
        G90                              ; Absolute positioning
        G1 Z10.0 F3000                   ; Lift to absolute Z=10mm floor
    {% endif %}

#####################################################################
#   Spoolman
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

