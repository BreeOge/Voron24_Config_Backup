[tmc2209 extruder]
uart_pin: SB2209: PA15
diag_pin: ^PA1
driver_SGTHRS: 100 # Adjust sensitivity (0-255)
interpolate: false
run_current: 0.5
sense_resistor: 0.110
#stealthchop_threshold: 0

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
driver_SGTHRS: 110 # Adjust sensitivity (0-255)
interpolate: true
run_current: 0.9
hold_current: 0.5
sense_resistor: 0.110
#stealthchop_threshold = 999999

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
driver_SGTHRS: 110 # Adjust sensitivity (0-255)
interpolate: true
run_current: 0.9
hold_current: 0.5
sense_resistor: 0.110
#stealthchop_threshold = 999999

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
#stealthchop_threshold = 999999

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
#stealthchop_threshold = 999999

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
#stealthchop_threshold = 999999

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
#stealthchop_threshold = 999999


