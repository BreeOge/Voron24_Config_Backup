########################################################################################################################
# BreeOge Happy Hare v4 user extensions
#
# The v3 Blobifier file had a local variable_seal_offset=14 patch and changed BLOBIFIER_CLEAN so the nozzle parked on
# the seal after wiping. Happy Hare v4 now provides extension hooks, so preserve that behavior without modifying the
# upstream-owned Blobifier macro.
########################################################################################################################

[gcode_macro _BREEOGE_BLOBIFIER_PARK_SEAL]
description: Park the nozzle on the Blobifier seal after the stock v4 cleaning pass
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    G90
    G1 X{bl.brush_start + 14} F{bl.travel_spd_xy}
