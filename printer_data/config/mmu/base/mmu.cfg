########################################################################################################################
# Happy Hare v4 migration seed - shared logical MMU configuration
# Migrated from BreeOge Happy Hare v3.42 config for an 8-gate, two-unit Naked Turtle setup.
#
# The v4 installer owns the full generated file. This seed contains user-specific settings so the current Happy Hare
# builder can refresh it into the complete v4 config while retaining these values.
########################################################################################################################

[mmu_machine]
happy_hare_version: 4.0.0
# Preserve old logical numbering: old mmu_2 provided gates 0-3 and is now unit0; old mmu provided gates 4-7 and is unit1.
units: unit0, unit1

[mmu_parameters]
# Logging
log_level: 1
log_file_level: 2
log_statistics: 1
log_visual: 1
log_startup_status: 1
log_m117_messages: 1

# Shared extruder movement
extruder_load_speed: 16
extruder_unload_speed: 16
extruder_sync_load_speed: 18
extruder_sync_unload_speed: 18
extruder_homing_speed: 18
macro_toolhead_max_accel: 0
macro_toolhead_min_cruise_ratio: 0.5

# Tip cutting and Blobifier purging
force_form_tip_standalone: 1
form_tip_macro: _MMU_CUT_TIP
extruder_form_tip_current: 100
force_purge_standalone: 1
purge_macro: BLOBIFIER
extruder_purge_current: 100

# Filament management
endless_spool_enabled: 1
endless_spool_on_load: 0
endless_spool_eject_gate: -1
spoolman_support: pull
spoolman_pending_id_timeout: 20
t_macro_color: gatemap
bypass_autoload: 1

# Console / stats
console_stat_columns: unload, load, post_load, total
console_stat_rows: total, total_average, job, job_average, last
console_gate_stat: emoticon
console_always_output_full: 1

# Workflow / safety
# Preserve the v3 long-pause behavior and the user's 60-second heater-disable delay.
timeout_pause: 72000
disable_heater: 60
default_extruder_temp: 250
extruder_temp_variance: 2
startup_reset_ttg_map: 0
show_error_dialog: 1
strict_filament_recovery: 0
filament_recovery_on_pause: 1
retry_tool_change_on_error: 0
print_start_detection: 1

# Klipper tuning
update_trsync: 0
canbus_comms_retries: 3
update_bit_max_time: 1
update_aht10_commands: 0

# Shared Stealthburner / G2E toolhead sensors and measured geometry.
[mmu_toolhead default]
extruder_switch_pin: SB2209:PB7
toolhead_switch_pin: SB2209:PB5
register_toolhead_sensors: 1
toolhead_extruder_to_nozzle: 110.19
toolhead_sensor_to_nozzle: 87.65
toolhead_entry_to_extruder: 10.22
toolhead_residual_filament: 6.89
toolhead_ooze_reduction: 0

# Gantry bumper servo used by the active toolhead cutter.
[mmu_servo mmu_gantry_servo]
pin: PG12
maximum_servo_angle: 180
minimum_pulse_width: 0.00075
maximum_pulse_width: 0.00225
initial_angle: 30

# Blobifier servo and bucket hardware, moved from v3 mmu/addons/blobifier_hw.cfg into the v4 shared hardware config.
[mmu_servo blobifier]
pin: PG9
minimum_pulse_width: 0.00053
maximum_pulse_width: 0.0023
maximum_servo_angle: 180

[gcode_button bucket]
pin: ^PG13
press_gcode:
  M117 bucket installed
release_gcode:
  M117 bucket removed
  _BLOBIFIER_COUNT_RESET
