########################################################################################################################
# Happy Hare v4 migration seed - unit0 parameters
# Values below are user-tuned v3.42 settings translated to v4 names/semantics.
########################################################################################################################

[mmu_unit_parameters unit0]

# Filament movement
gear_load_speed: 100
gear_load_accel: 100
gear_unload_speed: 80
gear_unload_accel: 100
gear_short_move_speed: 80
gear_short_move_accel: 600
gear_short_move_threshold: 70
gear_homing_speed: 50

# Gate homing / preload
# v3 gate_homing_endstop 'mmu_gate' is v4 'mmu_shared_exit'.
gate_homing_endstop: mmu_shared_exit
gate_homing_max: 70
# IMPORTANT: v4 reversed the sign convention from v3. Old +23 becomes -23.
gate_parking_distance: -23
gate_preload_endstop:
gate_preload_homing_max: 70
gate_preload_parking_distance: -10
gate_preload_attempts: 5
gate_autoload: 1
gate_final_eject_distance: 175

# Bowden / toolhead homing
bowden_homing_max: 2500
# v3 extruder_homing_buffer maps to the v4 fast-bowden load homing buffer.
bowden_load_homing_buffer: 25
# v3 gate_unload_buffer maps to the v4 bowden unload homing buffer.
bowden_unload_homing_buffer: 50
extruder_force_homing: 0
extruder_homing_endstop: extruder
extruder_homing_max: 80
extruder_collision_homing_current: 30
toolhead_homing_max: 80
toolhead_unload_safety_margin: 10
toolhead_post_load_tighten: 60
toolhead_post_load_tension_adjust: 1
toolhead_entry_tension_test: 1
toolhead_move_error_tolerance: 60

# Always-gripped VirtualSelector design: v4 forces gear/extruder sync flags on internally.
sync_gear_current: 100

# Shared proportional buffer / FlowGuard
sync_feedback_enabled: 1
sync_feedback_speed_multiplier: 5
sync_feedback_boost_multiplier: 3
sync_feedback_extrude_threshold: 5
sync_feedback_debug_log: 1
flowguard_enabled: 1
flowguard_max_relief: 40

# Calibration / autotune
autocal_bowden_length: 1
autotune_bowden_length: 1
skip_cal_rotation_distance: 0
autotune_rotation_distance: 0
encoder_move_validation: 1
