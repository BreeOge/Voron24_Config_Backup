########################################################################################################################
# Happy Hare v4 migration seed - unit1
#
# unit1 preserves old logical gates 4-7. These were connected to the old [mcu mmu].
# The wiring is BTT MMB v1.0-family, with the user's working/custom pin assignments preserved exactly.
########################################################################################################################

[mcu unit1]
canbus_interface: can0
canbus_uuid: a99262006fa1

[mmu_unit unit1]
vendor: Other
version: 1.0
num_gates: 4
display_name: Naked Turtle 1
buffer: shared
toolhead: default
extruder_name: extruder
gear_steppers: unit1_gear, unit1_gear_1, unit1_gear_2, unit1_gear_3
selector_type: VirtualSelector
variable_bowden_lengths: 1
variable_rotation_distances: 1
require_bowden_move: 1
filament_always_gripped: 1
show_bypass: 0
filament_buffer: 0

# Gate 4 (local gate 0)
[tmc2209 mmu_stepper unit1_gear]
uart_pin: unit1:PA10
run_current: 0.8
hold_current: 0.1
interpolate: True
sense_resistor: 0.110
stealthchop_threshold: 0

[mmu_stepper unit1_gear]
step_pin: unit1:PB15
dir_pin: !unit1:PB14
enable_pin: !unit1:PA8
rotation_distance: 4.54633736
gear_ratio: 1:1
microsteps: 16
full_steps_per_rotation: 200

# Gate 5 (local gate 1)
[tmc2209 mmu_stepper unit1_gear_1]
uart_pin: unit1:PC7

[mmu_stepper unit1_gear_1]
step_pin: unit1:PD2
dir_pin: !unit1:PB13
enable_pin: !unit1:PD1

# Gate 6 (local gate 2)
# NOTE: PD3 is intentionally preserved from the working v3 config; current generic MMB v1 defaults differ.
[tmc2209 mmu_stepper unit1_gear_2]
uart_pin: unit1:PC6

[mmu_stepper unit1_gear_2]
step_pin: unit1:PD0
dir_pin: !unit1:PD3
enable_pin: !unit1:PA15

# Gate 7 (local gate 3)
[tmc2209 mmu_stepper unit1_gear_3]
uart_pin: unit1:PA9

[mmu_stepper unit1_gear_3]
step_pin: unit1:PB6
dir_pin: !unit1:PB7
enable_pin: !unit1:PB5

[mmu_sensors unit1]
mmu_entry_switch_pin_0: ^unit1:PC14
mmu_entry_switch_pin_1: ^unit1:PC13
mmu_entry_switch_pin_2: ^unit1:PC15
mmu_entry_switch_pin_3: ^unit1:PB12
mmu_shared_exit_switch_pin: ^unit1:PB2
register_mmu_sensors: 1

# Shared proportional sync-feedback buffer. The physical ADC is on this MCU.
[mmu_buffer shared]
buffer_range: 6
buffer_maxrange: 12
buffer_spring_state: none
analog_pin: unit1:PA3
analog_max_compression: 1
analog_max_tension: 0
analog_neutral_point: 0.50
analog_gamma: 1
analog_sensor_threshold: 0.9
register_buffer_sensors: 1
