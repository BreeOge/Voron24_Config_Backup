########################################################################################################################
# Happy Hare v4 migration seed - user macro variables
#
# This intentionally contains the user-specific values from the old v3.42 configuration. Happy Hare v4's installer/
# builder will refresh this seed into the complete current mmu_macro_vars.cfg and add all new upstream variables/defaults.
########################################################################################################################

# Keep a single Klipper save_variables object and use the existing printer-wide variables file.
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[gcode_macro _MMU_SOFTWARE_VARS]
description: Migrated Happy Hare print start/end variables
gcode:
variable_user_pre_initialize_extension: ''
variable_home_mmu: False
variable_check_gates: True
variable_load_initial_tool: True
variable_automap_strategy: "none"
variable_user_print_end_extension: ''
variable_unload_tool: True
variable_reset_ttg: False
variable_dump_stats: True

[gcode_macro _MMU_STATE_VARS]
description: Migrated Happy Hare state variables
gcode:
variable_user_action_changed_extension: ''
variable_user_print_state_changed_extension: ''
variable_user_mmu_event_extension: ''
variable_servo_down_limit: 5000
variable_cutter_blade_limit: 3000

[gcode_macro _MMU_SEQUENCE_VARS]
description: Migrated Happy Hare sequence/parking variables
gcode:
variable_enable_park_printing: 'toolchange,load,unload,runout,complete,pause,cancel'
variable_enable_park_standalone: 'toolchange,load,unload,pause,cancel'
variable_enable_park_disabled: 'pause,cancel'
variable_min_toolchange_z: 1.0
variable_park_toolchange: 48, 352, 5, 0, 3
variable_park_runout: 38, 352, 5, 0, 3
variable_park_pause: 48, 352, 5, 0, 3
variable_park_cancel: 10, 352, 10, 0, 5
variable_park_complete: 10, 352, 10, 0, 5
variable_pre_unload_position: -999, -999, 0
variable_post_form_tip_position: 48, 352, 0
variable_pre_load_position: -999, -999, 0
variable_restore_xy_pos: "none"
variable_park_travel_speed: 200
variable_park_lift_speed: 15
variable_retract_speed: 30
variable_unretract_speed: 30
variable_user_park_move_macro: ''
variable_auto_home: True
variable_timelapse: False
variable_user_mmu_error_extension: ''
variable_user_pre_unload_extension: 'BLOBIFIER_PARK'
variable_user_post_form_tip_extension: ''
variable_user_post_unload_extension: ''
variable_user_pre_load_extension: ''
variable_user_post_load_extension: ''
variable_user_post_preload_extension: ''

[gcode_macro _MMU_CLIENT_VARS]
description: Migrated Happy Hare client macro variables
gcode:
variable_reset_ttg_on_cancel: False
variable_unload_tool_on_cancel: False
variable_user_pause_extension: ''
variable_user_resume_extension: ''
variable_user_cancel_extension: ''

# Active Stealthburner/Filametrix-style toolhead cutter tuning.
[gcode_macro _MMU_CUT_TIP_VARS]
description: Migrated Happy Hare toolhead cutter variables
gcode:
variable_restore_position: False
variable_blade_pos: 66.89
variable_retract_length: 40
variable_simple_tip_forming: True
variable_cut_axis_steppers: 'stepper_x, stepper_y'
variable_cut_stepper_current: 100
variable_cutting_axis: "x"
variable_pin_loc_xy: 11, 342.5
variable_pin_park_dist: 5.0
variable_pin_loc_compressed_xy: 3, 342.5
variable_rip_length: 1.0
variable_rip_speed: 3
variable_pushback_length: 8.0
variable_pushback_dwell_time: 0
variable_travel_speed: 150
variable_cut_fast_move_speed: 32
variable_cut_slow_move_speed: 8
variable_evacuate_speed: 150
variable_cut_dwell_time: 50
variable_cut_fast_move_fraction: 1.0
variable_extruder_move_speed: 25
variable_safe_margin_xy: 30, 30
variable_gantry_servo_enabled: True
variable_gantry_servo_down_angle: 160
variable_gantry_servo_up_angle: 30

# Blobifier variables moved from v3 mmu/addons/blobifier.cfg into the v4 _BLOBIFIER_VARS section.
# New v4-only Blobifier variables are intentionally omitted here so the current installer supplies its current defaults.
[gcode_macro _BLOBIFIER_VARS]
description: Migrated Blobifier variables
gcode:
variable_user_pre_blobifier_extension: ""
variable_clean_macro: "BLOBIFIER_CLEAN"
# Preserve BreeOge's old custom seal parking behavior via a v4 extension hook instead of patching upstream Blobifier code.
variable_user_post_purge_extension: "_BREEOGE_BLOBIFIER_PARK_SEAL"
variable_user_post_blobifier_extension: ""
variable_blobifier_type: "servo"
variable_toolhead_x: 70
variable_toolhead_y: 50
variable_travel_spd_xy: 10000
variable_travel_spd_z: 1000
variable_skew_correction: 0.1
variable_y_offset: 0
variable_force_safe_descend_height_until: 1.0
variable_purge_x: 10
variable_tray_top: 1.5
variable_tray_angle_out: 0
variable_tray_angle_in: 180
variable_dwell_time: 200
variable_brush_start: 35
variable_brush_width: 60
variable_brush_top: 0
variable_clearance_z: 2
variable_wipe_qty: 2
variable_wipe_spd_xy: 10000
variable_brush_y_offset: 2.8
variable_brush_accel: 0
variable_purge_length_minimum: 60
variable_purge_length_maximum: 150
variable_purge_length: 150
variable_purge_length_modifier: 0.7
variable_purge_length_addition: 0
# Old Blobifier always added Happy Hare's residual filament; preserve that behavior in the new explicit switch.
variable_include_extruder_residual: 1
variable_purge_spd: 400
variable_purge_temp_min: 250
variable_purge_start: 0.1
variable_z_raise: 12
variable_z_raise_exp: 0.85
variable_eject_hop: 1.0
variable_pressure_release_time: 2000
# These values were hard-coded in the old Blobifier implementation and are explicit v4 settings now.
variable_purge_pulse_size: 5
variable_retract_between_blobs: 2
variable_retract_step: 2
variable_pulse_retract_length: 2
variable_pulse_retract_speed: 1800
variable_pulse_deretract_speed: 800
variable_purge_retract_interval: 40
variable_part_cooling_fan: 1.0
variable_part_cooling_fan_blob_deposit: 1
variable_fan_name: ""
variable_max_blobs: 400
variable_enable_shaker: 0
variable_shaker_pos_x: 0
variable_bucket_shakes: 10
variable_shake_accel: 4000
variable_bucket_shake_frequency: 0.95
variable_shaker_arm_z: 3
